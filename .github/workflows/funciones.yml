# Instala (o actualiza) las Edge Functions de Supabase: hoy "admin-usuarios"
# (alta de usuarios y restablecimiento de contraseñas por el administrador).
# Secrets requeridos (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN  token personal de https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   identificador del proyecto (el texto xxxx de https://xxxx.supabase.co)
name: Funciones Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/funciones.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuración
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Faltan SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF: no se instala nada."; echo "SIN_CONFIG=1" >> "$GITHUB_ENV"
          fi
      - uses: supabase/setup-cli@v1
        if: env.SIN_CONFIG != '1'
        with:
          version: 2.119.0   # versión fija (reproducible); actualizar a propósito
      - name: Desplegar admin-usuarios
        if: env.SIN_CONFIG != '1'
        # La función valida la sesión por sí misma (compatible con las claves JWT nuevas de Supabase)
        run: supabase functions deploy admin-usuarios --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
