# Publica el aplicativo (carpeta app/) en GitHub Pages.
# La URL y la anon key de Supabase se toman de las *variables* del repositorio
# (Settings → Secrets and variables → Actions → Variables): SUPABASE_URL y SUPABASE_ANON_KEY.
# Si no existen, se publica en modo demostración.
name: Publicar aplicativo

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Escribir config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            if [[ "$SUPABASE_ANON_KEY" == sb_secret_* ]] || printf '%s' "$SUPABASE_ANON_KEY" | cut -d. -f2 | base64 -d 2>/dev/null | grep -q '"service_role"'; then
              echo "::error::SUPABASE_ANON_KEY contiene una clave secreta (service_role / sb_secret). Use la anon key o la publishable key." ; exit 1
            fi
            printf "window.LPSGT_CONFIG = {\n  supabaseUrl: '%s',\n  supabaseAnonKey: '%s',\n};\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > app/config.js
            echo "Configuración de Supabase aplicada."
          else
            echo "Sin variables SUPABASE_URL / SUPABASE_ANON_KEY: se usa la conexión de app/config.js (vacía = modo demostración)."
          fi
          # Monitoreo de errores (opcional): variable SENTRY_DSN del repositorio
          if [ -n "$SENTRY_DSN" ]; then
            if [[ ! "$SENTRY_DSN" =~ ^https://[A-Za-z0-9]+@[A-Za-z0-9.-]+/[0-9]+$ ]]; then
              echo "::error::SENTRY_DSN no tiene el formato https://clave@servidor/proyecto" ; exit 1
            fi
            printf "window.LPSGT_CONFIG.sentryDsn = '%s';\n" "$SENTRY_DSN" >> app/config.js
            echo "Monitoreo con Sentry activado."
          fi
          # Versión visible en el aplicativo (menú de usuario y aviso tras la recarga forzada)
          printf "window.LPSGT_VERSION = '%s · %s';\n" "${GITHUB_SHA::7}" "$(TZ=America/Lima date '+%d/%m/%Y %H:%M')" >> app/config.js
          # Versión de caché del service worker = commit, para que los usuarios reciban la actualización
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'lpsgt-${GITHUB_SHA::8}'/" app/sw.js
      - name: Verificar conexión con Supabase
        run: |
          URL=$(grep -oE "supabaseUrl: '[^']*'" app/config.js | cut -d"'" -f2)
          KEY=$(grep -oE "supabaseAnonKey: '[^']*'" app/config.js | cut -d"'" -f2)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Modo demostración: sin conexión que verificar."; exit 0; fi
          auth=$(curl -s -o /dev/null -w '%{http_code}' "$URL/auth/v1/settings" -H "apikey: $KEY")
          tabla=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/listas?select=id&limit=1" -H "apikey: $KEY")
          echo "Autenticación: HTTP $auth · Base de datos (tabla listas): HTTP $tabla"
          [ "$auth" = "200" ] || echo "::warning::Supabase no aceptó la URL o la clave (HTTP $auth)."
          [ "$tabla" = "200" ] || echo "::warning::La base de datos no responde o faltan las migraciones (HTTP $tabla)."
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # intenta activar Pages si aún no lo está
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
