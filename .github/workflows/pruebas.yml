# Verifica las migraciones y reglas de seguridad de la base de datos, y la sintaxis del aplicativo.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PostgreSQL 16
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16 >/dev/null
      - name: Migraciones y reglas
        run: sudo PGBIN=/usr/lib/postgresql/16/bin bash supabase/tests/run.sh
  aplicativo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis de los módulos
        run: for f in $(find app/js -name '*.js'); do node --check "$f" || exit 1; done
